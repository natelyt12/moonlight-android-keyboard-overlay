name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install SDK and NDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          MOONLIGHT_STORE_FILE: ${{ runner.temp }}/release.keystore
          MOONLIGHT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MOONLIGHT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MOONLIGHT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleNonRootRelease

      - name: Collect artifacts
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle | head -1)
          APK=$(find app/build/outputs/apk/nonRoot/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/MoonlightKB-${VERSION}-nonRoot.apk"
          cd dist && sha256sum ./*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify APK is signed
        run: |
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --print-certs dist/MoonlightKB-*-nonRoot.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlightkb-release
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
